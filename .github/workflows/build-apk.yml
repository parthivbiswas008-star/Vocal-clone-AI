name: Build Debug APK and Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-}"

          JAVA_VERSION_OUTPUT="$(java -version 2>&1)"
          echo "$JAVA_VERSION_OUTPUT"

          RAW_VERSION="$(printf '%s\n' "$JAVA_VERSION_OUTPUT" | head -n 1 | sed -nE 's/.*version "([^"]+)".*/\1/p')"
          if [ -z "$RAW_VERSION" ]; then
            echo "::error::Could not detect the active Java version from 'java -version'."
            exit 1
          fi

          if [[ "$RAW_VERSION" == 1.* ]]; then
            MAJOR_VERSION="$(printf '%s' "$RAW_VERSION" | cut -d. -f2)"
          else
            MAJOR_VERSION="$(printf '%s' "$RAW_VERSION" | cut -d. -f1 | sed -E 's/[^0-9].*$//')"
          fi

          if ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse active Java major version from '$RAW_VERSION'."
            exit 1
          fi

          echo "Detected Java major version: $MAJOR_VERSION"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but Java $MAJOR_VERSION ($RAW_VERSION) is active."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="./debug.keystore"

          if [ -f "$KEYSTORE_PATH" ]; then
            echo "Debug keystore already exists; skipping generation."
          else
            if [ -z "${JAVA_HOME:-}" ] || [ ! -x "${JAVA_HOME}/bin/keytool" ]; then
              echo "::error::keytool was not found under JAVA_HOME (${JAVA_HOME:-unset})."
              exit 1
            fi

            echo "Generating temporary debug keystore..."
            "${JAVA_HOME}/bin/keytool" -genkeypair \
              -noprompt \
              -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1 || {
                echo "::error::Failed to create temporary debug keystore at $KEYSTORE_PATH."
                exit 1
              }
          fi

          if [ ! -f "$KEYSTORE_PATH" ] || [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Expected debug keystore at $KEYSTORE_PATH does not exist or is empty."
            exit 1
          fi
          echo "Temporary debug keystore is ready."

      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -e "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK was not found at $EXPECTED_APK."
            if [ -d "app/build/outputs/apk" ]; then
              echo "APK files discovered inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name '*.apk' -print || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::$EXPECTED_APK exists but is not a regular file."
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::$EXPECTED_APK is empty."
            exit 1
          fi

          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "::error::$EXPECTED_APK does not have the .apk extension."
            exit 1
          fi

          APK_SIZE="$(wc -c < "$EXPECTED_APK" | tr -d ' ')"
          echo "Verified debug APK: $EXPECTED_APK (${APK_SIZE} bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vocal clone ai
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$SOURCE_APK" ] || [ ! -s "$SOURCE_APK" ] || [[ "$SOURCE_APK" != *.apk ]]; then
            echo "::error::Verified debug APK is missing or invalid: $SOURCE_APK"
            exit 1
          fi

          ASSET_DIR="$(mktemp -d "${RUNNER_TEMP}/apk-release-asset.XXXXXX")"
          ASSET_NAME="vocal-clone-ai.apk"
          ASSET_PATH="${ASSET_DIR}/${ASSET_NAME}"

          cp -- "$SOURCE_APK" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Failed to prepare APK release asset at $ASSET_PATH."
            exit 1
          fi

          echo "Prepared release asset: $ASSET_NAME"
          {
            echo "asset_path=$ASSET_PATH"
            echo "asset_name=$ASSET_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_release_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_release_asset.outputs.asset_name }}
        run: |
          set -euo pipefail

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Vocal Clone AI (Build #${GITHUB_RUN_NUMBER})"

          {
            echo "release_tag=$RELEASE_TAG"
            echo "release_title=$RELEASE_TITLE"
          } >> "$GITHUB_OUTPUT"

          if ! command -v gh >/dev/null 2>&1; then
            echo "::warning::GitHub CLI (gh) is not available. Skipping GitHub Release creation; the Actions artifact 'vocal clone ai' remains available."
            exit 1
          fi
          gh --version

          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::warning::Prepared release APK asset is missing or invalid. Skipping GitHub Release creation; the Actions artifact 'vocal clone ai' remains available."
            exit 1
          fi

          RELEASE_NOTES="$(cat <<EOF
          Automatically generated **Vocal Clone AI** debug APK built by GitHub Actions.

          - **Workflow Run Number:** ${GITHUB_RUN_NUMBER}
          - **Workflow Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** ${GITHUB_SHA}
          - **APK Asset:** ${ASSET_NAME}

          > **Important Notice:**
          > - This APK is intended for testing only.
          > - This APK is **not** a Play Store production release.
          > - This APK is signed only with a temporary debug keystore.
          EOF
          )"

          if ! gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest; then
            echo "::warning::Failed to publish GitHub Release '${RELEASE_TAG}'. The APK build succeeded and the Actions artifact 'vocal clone ai' remains available."
            exit 1
          fi

      - name: Report APK download result
        if: ${{ !cancelled() && (steps.publish_release.outcome == 'success' || steps.publish_release.outcome == 'failure') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
          RELEASE_TAG: ${{ steps.publish_release.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.publish_release.outputs.release_title }}
          ASSET_NAME: ${{ steps.prepare_release_asset.outputs.asset_name }}
        run: |
          set -euo pipefail

          RELEASE_URL=""
          VERIFIED_TAG=""
          VERIFIED_TITLE=""
          VERIFIED_ASSET=""

          if [ "$RELEASE_OUTCOME" = "success" ] && [ -n "${RELEASE_TAG:-}" ]; then
            if RELEASE_JSON="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,name,assets 2>/dev/null)"; then
              RELEASE_URL="$(printf '%s' "$RELEASE_JSON" | jq -r '.url // empty')"
              VERIFIED_TAG="$(printf '%s' "$RELEASE_JSON" | jq -r '.tagName // empty')"
              VERIFIED_TITLE="$(printf '%s' "$RELEASE_JSON" | jq -r '.name // empty')"
              VERIFIED_ASSET="$(printf '%s' "$RELEASE_JSON" | jq -r --arg name "$ASSET_NAME" '.assets[]? | select(.name == $name) | .name' | head -n 1)"
            fi
          fi

          if [ "$RELEASE_OUTCOME" = "success" ] && [ -n "$RELEASE_URL" ] && [ -n "$VERIFIED_ASSET" ]; then
            echo "GitHub Release published and verified."
            echo "Release Tag: ${VERIFIED_TAG}"
            echo "Release Title: ${VERIFIED_TITLE}"
            echo "Release URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${VERIFIED_ASSET}"

            {
              echo "### Debug APK Build & GitHub Release Published"
              echo ""
              echo "- **Release Tag:** \`${VERIFIED_TAG}\`"
              echo "- **Release Title:** ${VERIFIED_TITLE}"
              echo "- **Release Page:** ${RELEASE_URL}"
              echo "- **APK Asset Filename:** \`${VERIFIED_ASSET}\`"
              echo ""
              echo "You can download the APK directly from the **Assets** section on the GitHub Release page above."
              echo ""
              echo "The standard GitHub Actions artifact (\`vocal clone ai\`) is also available in this workflow run as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed or could not be verified. The debug APK build succeeded and the GitHub Actions artifact 'vocal clone ai' remains available for download."

            {
              echo "### Debug APK Build Succeeded (GitHub Release Publishing Failed)"
              echo ""
              echo "> **Warning:** Publishing the APK to GitHub Releases failed or could not be verified."
              echo ""
              echo "- **APK Build Status:** Succeeded"
              echo "- **Actions Artifact Backup:** \`vocal clone ai\` is available for download from the **Artifacts** section of this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
